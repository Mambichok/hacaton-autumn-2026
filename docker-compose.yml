services:
  app:
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - deploy/vps.env
    environment:
      QDRANT_URL: http://qdrant:6333
      DOCUMENTS_ORIGINAL_DIR: /app/source-documents
      DOCUMENTS_UPLOAD_DIR: /app_data/uploaded
      DOCUMENT_TEMPLATES_DIR: /app_data/templates
      ADMIN_DATABASE_PATH: /app_data/admins.sqlite3
    depends_on:
      - qdrant
    ports:
      - "127.0.0.1:8766:8000"
    volumes:
      - ./deploy/source-documents:/app/source-documents:ro
      - app_data:/app_data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1500m
    cpus: 1.5
    pids_limit: 128

  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    expose:
      - "6333"
    volumes:
      - qdrant_data:/qdrant/storage
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 0.5

volumes:
  app_data:
  qdrant_data:
